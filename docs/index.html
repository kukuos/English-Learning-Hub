<style data-page-node-id="xTVGVnhuw8UsuQAND9VN1J" data-pnid-children="W084uOhD06OF2p5AP6c9ET">
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --ink:#15171e; --ink2:#3b4050; --muted:#7b8296;
    --line:#e9ecf4; --line2:#f1f3f9;
    --brand:#4f46e5; --brand2:#7c6cf5; --brand-soft:#eef0ff;
    --amber:#f59e0b; --amber-soft:#fff6e5;
    --green:#0f9d76; --green-soft:#e7f7f1;
    --rose:#e35d6a; --rose-soft:#fdeef0;
    --shadow:0 1px 2px rgba(20,24,40,.04),0 8px 24px rgba(20,24,40,.06);
  }
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:20px 18px 64px}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 18px}
  .logo{display:flex;align-items:center;gap:11px}
  .logo .mark{
    width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--brand),var(--brand2));color:#fff;
    font-weight:700;font-size:17px;letter-spacing:-.5px;box-shadow:0 6px 16px rgba(79,70,229,.28)
  }
  .logo h1{font-size:17px;margin:0;letter-spacing:-.2px}
  .logo p{margin:1px 0 0;font-size:12px;color:var(--muted)}
  .topbar .spacer{flex:1}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--ink2);box-shadow:var(--shadow)
  }
  .chip b{color:var(--ink);font-weight:600}
  .chip.streak{background:var(--amber-soft);border-color:#fbe3b4;color:#8a5a00}
  .chip.streak b{color:#8a5a00}

  .tabs{display:flex;gap:4px;background:#eceef6;padding:4px;border-radius:14px;margin-bottom:20px;overflow-x:auto}
  .tab{
    flex:1 0 auto;border:0;background:transparent;padding:9px 16px;border-radius:11px;cursor:pointer;
    font-size:13.5px;color:var(--muted);font-family:inherit;white-space:nowrap;transition:.16s
  }
  .tab:hover{color:var(--ink2)}
  .tab.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 2px 8px rgba(20,24,40,.08)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .panel h2{font-size:14px;margin:0 0 14px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .panel h2 .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:16px}
  @media(max-width:840px){.grid2{grid-template-columns:1fr}}

  .hero{
    position:relative;overflow:hidden;border-radius:20px;padding:24px 26px;margin-bottom:16px;
    background:linear-gradient(120deg,#3b33c9 0%,#5b4fe0 52%,#8b7bf7 100%);color:#fff;
    display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    box-shadow:0 14px 34px rgba(76,64,214,.26)
  }
  .hero::after{
    content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)
  }
  .hero .pill{display:inline-block;background:rgba(255,255,255,.18);padding:4px 11px;border-radius:999px;font-size:12px;letter-spacing:.3px}
  .hero h2{font-size:22px;margin:10px 0 6px;line-height:1.35;letter-spacing:-.3px;font-weight:650}
  .hero p{margin:0;font-size:13px;color:rgba(255,255,255,.86);max-width:520px}
  .ring{position:relative;width:96px;height:96px;flex:0 0 auto;z-index:1}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:650}
  .ring .val small{display:block;font-size:10.5px;font-weight:400;opacity:.8;margin-top:-2px}

  .task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .task:last-child{border-bottom:0}
  .task .box{
    width:19px;height:19px;border-radius:6px;border:1.6px solid #cfd5e6;flex:0 0 auto;margin-top:2px;
    display:grid;place-items:center;transition:.16s;background:#fff
  }
  .task .box svg{opacity:0;transform:scale(.6);transition:.16s}
  .task.done .box{background:var(--green);border-color:var(--green)}
  .task.done .box svg{opacity:1;transform:scale(1)}
  .task.done .tx{color:var(--muted);text-decoration:line-through}
  .task .tx{font-size:13.5px;color:var(--ink2)}

  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:11px;padding:9px 15px;
    font-size:13.5px;font-family:inherit;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:7px
  }
  .btn:hover{border-color:#d3d9ea;background:#fbfcff}
  .btn.primary{background:linear-gradient(145deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(79,70,229,.25)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--line2);color:var(--ink2)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.full{width:100%;justify-content:center}

  .big-num{font-size:30px;font-weight:680;letter-spacing:-1px;line-height:1.1}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:720px){.kpi{grid-template-columns:repeat(2,1fr)}}
  .kpi .cell{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .cell .lb{font-size:12px;color:var(--muted);margin-bottom:4px}
  .kpi .cell .sub{font-size:11.5px;color:var(--muted)}

  .due-strip{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
  .due-strip .n{font-size:32px;font-weight:680;letter-spacing:-1.5px;line-height:1}
  .due-strip .n small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}

  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=number],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;
    font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:.16s
  }
  input:focus,select:focus,textarea:focus{border-color:#b9b3f7;box-shadow:0 0 0 3px rgba(124,108,245,.13)}
  textarea{resize:vertical;min-height:62px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  /* flashcard */
  .flash-wrap{max-width:600px;margin:0 auto}
  .flash{
    background:var(--panel);border:1px solid var(--line);border-radius:22px;min-height:290px;
    padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
    box-shadow:0 12px 34px rgba(20,24,40,.09);cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s
  }
  .flash:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(20,24,40,.12)}
  .flash .badge{
    position:absolute;top:16px;left:18px;font-size:11.5px;color:var(--brand);background:var(--brand-soft);
    padding:3px 10px;border-radius:999px;font-weight:600
  }
  .flash .lv{position:absolute;top:16px;right:18px;display:flex;gap:3px}
  .flash .lv i{width:6px;height:6px;border-radius:50%;background:#e2e5ef}
  .flash .lv i.on{background:var(--brand)}
  .flash .word{font-size:38px;font-weight:650;letter-spacing:-1px;line-height:1.2;word-break:break-word}
  .flash .ipa{color:var(--muted);font-size:15px;margin-top:8px;letter-spacing:.4px}
  .flash .mean{font-size:19px;color:var(--ink2);font-weight:500;margin-top:4px}
  .flash .ex{font-size:13.5px;color:var(--muted);margin-top:16px;max-width:420px}
  .flash .ex b{color:var(--ink2);font-weight:500;display:block;font-size:15px;margin-bottom:3px}
  .flash .hint{position:static;margin-top:14px;font-size:11.5px;color:#aeb4c6}
  .speak{
    margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;
    font-size:12.5px;color:var(--ink2);cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-family:inherit
  }
  .speak:hover{background:var(--brand-soft);border-color:#d8d3fb;color:var(--brand)}
  .audiobar{display:flex;align-items:center;gap:6px;margin:-6px 0 14px;font-size:12px;color:var(--muted);overflow-x:auto;white-space:nowrap;padding:2px 0}
  .audiobar .alabel{white-space:nowrap;color:#9aa1b4}
  .aseg{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;padding:4px 10px;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .aseg.on{background:var(--brand-soft);border-color:#d9dcff;color:var(--brand);font-weight:600}
  .asep{width:1px;height:13px;background:var(--line);margin:0 2px}
  .flash .sampleword{font-size:12.5px;color:var(--muted);margin-top:10px}
  .flash .sampleword b{color:var(--ink2);font-weight:600}
  .flash .pairbox{margin-top:12px;background:#fafbff;border:1px dashed #dfe3f0;border-radius:12px;padding:9px 11px;width:100%;max-width:380px;cursor:default}
  .flash .plabel{font-size:11.5px;color:var(--muted);margin-bottom:7px;text-align:left}
  .flash .prow{display:flex;gap:8px}
  .flash .prow .btn{flex:1}
  .chunk{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;justify-content:center}
  .chunk span{font-size:12px;color:var(--ink2);background:#f4f5fa;border-radius:7px;padding:3px 8px}
  .chunk span.hit{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .sayrow{display:flex;align-items:center;gap:10px;background:#fafbff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:8px}
  .sayrow .saytext{flex:1;font-size:13.5px;font-weight:500;line-height:1.5}
  .sayrow .saybtns{display:flex;gap:6px;flex:0 0 auto}
  .sayrow .btn.sm{padding:6px 9px}
  @media(max-width:520px){
    .sayrow{flex-direction:column;align-items:stretch;gap:8px}
    .sayrow .saybtns{justify-content:flex-end}
  }
  .recline{font-size:12px;color:var(--muted);margin-bottom:12px}
  .mic-live{background:var(--rose-soft)!important;border-color:#f3c6cc!important;color:#bd3d4c!important;font-weight:600}
  .timerbox{display:flex;align-items:center;gap:10px;background:#f7f8ff;border:1px solid #e6e8f8;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .timerbox .tnum{font-size:16px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .timerbox .tlabel{font-size:11.5px;color:var(--muted);margin-bottom:1px}
  .qopt{justify-content:center;font-size:15px;padding:12px}
  .quizbig{font-size:26px;font-weight:700;color:var(--brand)}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .grades.two{grid-template-columns:repeat(2,1fr)}
  .grade{
    border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 8px;cursor:pointer;
    font-family:inherit;font-size:13.5px;color:var(--ink2);transition:.16s;text-align:center
  }
  .grade small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .grade:hover{transform:translateY(-1px)}
  .grade.g1:hover{border-color:#f3b8bf;background:var(--rose-soft);color:#a5323f}
  .grade.g2:hover{border-color:#f7d79a;background:var(--amber-soft);color:#8a5a00}
  .grade.g3:hover{border-color:#a7e2cd;background:var(--green-soft);color:#0b6b52}
  .progress-line{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 16px}
  .progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}

  /* list */
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=text]{width:200px}
  .fchip{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;
    color:var(--muted);cursor:pointer;font-family:inherit
  }
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .card-row{
    display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line2)
  }
  .card-row:last-child{border-bottom:0}
  .card-row .main{flex:1;min-width:0}
  .card-row .c1{font-size:14.5px;font-weight:600;letter-spacing:-.1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card-row .c2{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--line2);color:var(--muted);font-weight:500}
  .tag.t1{background:#eef4ff;color:#3b62c9}
  .tag.t2{background:#eafaf3;color:#0b7a5b}
  .tag.t3{background:#fff5e8;color:#9a6209}
  .tag.t4{background:#f4eeff;color:#6b46c1}
  .tag.t5{background:#fdeef0;color:#b23a48}
  .dots{display:flex;gap:3px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#e2e5ef}
  .dots i.on{background:var(--green)}
  .due-txt{font-size:11.5px;color:var(--muted);white-space:nowrap;min-width:74px;text-align:right}
  .due-txt.now{color:var(--brand);font-weight:600}
  .ico-btn{border:0;background:transparent;color:#b9bfd0;cursor:pointer;padding:5px;border-radius:8px;line-height:0}
  .ico-btn:hover{background:var(--line2);color:var(--ink2)}

  .bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;align-items:center;height:100%}
  .bars .b i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#a99efb,#5b4fe0);min-height:3px;transition:.3s}
  .bars .b i.zero{background:#eef0f7}
  .bars .b span{font-size:10px;color:#a8aec0}
  .lv-list{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .lv-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
  .lv-row .lb{width:52px;color:var(--muted);flex:0 0 auto}
  .lv-row .track{flex:1;height:9px;background:#f2f4fa;border-radius:999px;overflow:hidden}
  .lv-row .track i{display:block;height:100%;background:linear-gradient(90deg,#7c6cf5,#4f46e5);border-radius:999px}
  .lv-row .n{width:26px;text-align:right;color:var(--muted);font-size:12px}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .ic{font-size:34px;margin-bottom:8px;opacity:.5}

  .banner{background:#fff4f4;border:1px solid #f6d4d8;color:#93414b;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:16px}

  .guide h3{font-size:14.5px;margin:22px 0 8px}
  .guide h3:first-child{margin-top:0}
  .guide p,.guide li{font-size:13.5px;color:var(--ink2);line-height:1.75}
  .guide ul{padding-left:18px;margin:6px 0}
  .guide .note{background:var(--brand-soft);border-left:3px solid var(--brand);padding:10px 14px;border-radius:0 10px 10px 0;font-size:13px;color:#3f3a8f;margin:12px 0}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:7px 8px;border-bottom:1px solid var(--line)}
  .tbl td{padding:7px 8px;border-bottom:1px solid var(--line2);color:var(--ink2)}
  .tbl td:first-child{white-space:nowrap;color:var(--muted);font-size:12px}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(18,20,32,.42);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:480px;padding:22px;box-shadow:0 24px 60px rgba(15,18,35,.28);max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 16px;font-size:16px}
  .modal .foot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#15171e;color:#fff;
    padding:10px 18px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:80
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .skel{background:linear-gradient(90deg,#f2f4fa,#e9ecf5,#f2f4fa);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* ---- 新增：弱项池 / 对话 / 新卡上限 / 离线 ---- */
  .card-row .c2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;overflow:hidden}
  .kpi{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .leech-row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
  .leech-row:last-child{border-bottom:0}
  .leech-row .lmain{flex:1;min-width:0}
  .leech-row .len{font-size:14.5px;font-weight:600;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .leech-row .lcn{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag.leech{background:#fdeef0;color:#b23a48}
  .capbar{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);margin:-2px 0 12px;flex-wrap:wrap}
  .capbar .track{flex:1 1 60px;min-width:46px;max-width:170px;height:6px;background:#f1f3f9;border-radius:999px;overflow:hidden}
  .capbar .track i{display:block;height:100%;background:linear-gradient(90deg,#7c6cf5,#4f46e5)}
  .capbar.warn{color:#a5323f}
  .capbar.warn .track i{background:linear-gradient(90deg,#e88,#d3545f)}
  .dlg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
  .dlg-card{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:#fff}
  .dlg-card:hover{border-color:#cfd6ea;box-shadow:0 8px 22px rgba(20,24,40,.07);transform:translateY(-1px)}
  .dlg-card .dt{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .dlg-card .ds{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.6}
  .dlg-card .dm{font-size:11.5px;color:#9aa1b4;margin-top:9px}
  .modeseg{display:inline-flex;background:#eceef6;border-radius:10px;padding:3px;gap:2px}

    o.id = "demo-log-" + (i + 1);
    o.date = addDays(TODAY, o.dayOffset);
    return o;
  });

  function dashboard(day){
    day = day || TODAY;
    var due = CARDS.filter(function(c){ return !c.due || c.due <= day; });
    var mastered = CARDS.filter(function(c){ return c.level >= MASTER; }).length;
    var leech = CARDS.filter(function(c){ return c.lapses >= LEECH && c.level < MASTER; }).length;
    var levelDist = [0,0,0,0,0,0,0];
    CARDS.forEach(function(c){
      var idx = Math.max(0, Math.min(6, Math.round(c.level)));
      levelDist[idx] += 1;
    });
    var byType = {};
    CARDS.forEach(function(c){
      var key = c.type || "未分类";
      byType[key] = (byType[key] || 0) + 1;
    });
    var logDates = LOGS.map(function(l){ return l.date; }).sort();
    var start = logDates[0] || "";
    var dayIndex = start ? Math.max(1, diffDays(start, day) + 1) : 1;
    var last14 = [];
    for(var i = 13; i >= 0; i--){
      var key = addDays(day, -i);
      var hit = null;
      for(var j = 0; j < LOGS.length; j++){ if(LOGS[j].date === key){ hit = LOGS[j]; break; } }
      last14.push({
        date: key,
        minutes: hit ? hit.minutes : 0,
        done: hit ? hit.done : "",
        quizRate: hit ? hit.quizRate : 0
      });
    }
    var todayLog = null;
    for(var t = 0; t < LOGS.length; t++){ if(LOGS[t].date === day){ todayLog = LOGS[t]; break; } }
    var recent = LOGS.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; }).slice(0, 8);
    var streakSet = {};
    LOGS.forEach(function(l){ streakSet[l.date] = 1; });
    var cursor = streakSet[day] ? day : addDays(day, -1);
    var streak = 0;
    while(streakSet[cursor]){ streak += 1; cursor = addDays(cursor, -1); }
    return {
      date: day,
      dayIndex: dayIndex,
      finishedDays: LOGS.length,
      stats: {
        total: CARDS.length,
        mastered: mastered,
        due: due.length,
        streak: streak,
        totalMinutes: LOGS.reduce(function(s, l){ return s + l.minutes; }, 0),
        totalReviews: LOGS.reduce(function(s, l){ return s + l.reviews; }, 0),
        leech: leech,
        todayAdded: CARDS.filter(function(c){ return c.added === day; }).length,
        dailyCap: DAILY_CAP,
        newSevenDays: LOGS.filter(function(l){ var d = diffDays(l.date, day); return d >= 0 && d <= 6; })
          .reduce(function(s, l){ return s + l.newCards; }, 0)
      },
      levelDist: levelDist,
      byType: byType,
      last14: last14,
      todayLog: todayLog,
      recentLogs: recent
    };
  }

  function listCards(p){
    p = p || {};
    var day = p.date || TODAY;
    var show = CARDS.slice();
    var type = (p.type || "").trim();
    var stage = (p.stage || "").trim();
    var kw = (p.keyword || "").trim().toLowerCase();
    if(type) show = show.filter(function(c){ return c.type === type; });
    if(stage) show = show.filter(function(c){ return c.stage === stage; });
    if(kw) show = show.filter(function(c){
      return (c.content + " " + c.meaning + " " + c.example + " " + c.ipa).toLowerCase().indexOf(kw) >= 0;
    });
    if(p.onlyDue) show = show.filter(function(c){ return !c.due || c.due <= day; });
    if(p.leechOnly){
      show = show.filter(function(c){ return c.lapses >= LEECH && c.level < MASTER; });
      show.sort(function(a, b){
        return b.lapses === a.lapses ? a.level - b.level : b.lapses - a.lapses;
      });
    } else {
      show.sort(function(a, b){
        return a.due === b.due ? a.level - b.level : (a.due < b.due ? -1 : 1);
      });
    }
    var offset = Number(p.offset || 0);
    var limit = Math.min(Math.max(Number(p.limit || 20), 1), 100);
    return { total: show.length, offset: offset, cards: show.slice(offset, offset + limit) };
  }

  function reviewQueue(p){
    p = p || {};
    var day = p.date || TODAY;
    var due = CARDS.filter(function(c){ return !c.due || c.due <= day; }).sort(function(a, b){
      var la = a.lapses >= LEECH ? 1 : 0;
      var lb = b.lapses >= LEECH ? 1 : 0;
      if(la !== lb) return la - lb;
      return a.level === b.level ? (a.due < b.due ? -1 : 1) : a.level - b.level;
    });
    var limit = Math.min(Math.max(Number(p.limit || 20), 1), 60);
    return { total: due.length, cards: due.slice(0, limit) };
  }

  function findCard(id){
    for(var i = 0; i < CARDS.length; i++){ if(CARDS[i].id === id) return CARDS[i]; }
    return null;
  }

  function addCard(p){
    p = p || {};
    var content = (p.content || "").trim();
    if(!content) return { ok:false, message:"卡片内容不能为空" };
    var day = p.date || TODAY;
    var addedToday = CARDS.filter(function(c){ return c.added === day; }).length;
    if(!p.force && addedToday >= DAILY_CAP){
      return { ok:false, capped:true, todayAdded:addedToday, cap:DAILY_CAP,
               message:"今天已经加了 " + addedToday + " 张新卡，够今天学的了" };
    }
    var card = {
      id: "demo-new-" + (CARDS.length + 1),
      content: content,
      meaning: (p.meaning || "").trim(),
      type: p.type || "单词",
      stage: p.stage || "W2 高频词",
      ipa: (p.ipa || "").trim(),
      example: (p.example || "").trim(),
      exampleCn: (p.exampleCn || "").trim(),
      level: 0,
      lapses: 0,
      due: day,
      added: day
    };
    CARDS.push(card);
    return { ok:true, id:card.id, cap:DAILY_CAP };
  }

  function updateCard(p){
    p = p || {};
    var card = findCard((p.recordId || "").trim());
    if(!card) return { ok:false, message:"缺少卡片标识" };
    var keys = ["content","meaning","type","stage","ipa","example","exampleCn","level","lapses","due"];
    var updated = 0;
    keys.forEach(function(k){
      if(p[k] !== undefined && p[k] !== null && p[k] !== ""){
        if(k === "level" || k === "lapses") card[k] = clamp(p[k], 0, 99);
        else card[k] = String(p[k]).trim();
        updated += 1;
      }
    });
    if(!updated) return { ok:false, message:"没有需要更新的内容" };
    return { ok:true, updated:updated };
  }

  function deleteCard(p){
    p = p || {};
    var id = (p.recordId || "").trim();
    for(var i = 0; i < CARDS.length; i++){
      if(CARDS[i].id === id){ CARDS.splice(i, 1); return { ok:true }; }
    }
    return { ok:false, message:"缺少卡片标识" };
  }

  function reviewCard(p){
    p = p || {};
    var card = findCard((p.recordId || "").trim());
    if(!card) return { ok:false, message:"缺少卡片标识" };
    if(p.grade !== "again" && p.grade !== "hard" && p.grade !== "good"){
      return { ok:false, message:"评分无效" };
    }
    var day = p.date || TODAY;
    var cur = Math.max(0, Math.min(6, Math.round(Number(p.level || 0))));
    var lapses = clamp(p.lapses, 0, 99);
    var level = cur, interval = 0;
    if(p.grade === "again"){ level = 0; interval = 0; }
    else if(p.grade === "hard"){ level = Math.max(1, cur); interval = Math.max(1, Math.round(INTERVALS[Math.max(1, level)] * 0.6)); }
    else { level = Math.min(6, cur + 1); interval = INTERVALS[level]; }
    var next = lapses;
    if(p.grade === "again") next = Math.min(99, lapses + 1);
    else if(p.grade === "good") next = Math.max(0, lapses - 1);
    var due = addDays(day, interval);
    card.level = level;
    card.due = due;
    card.lapses = next;
    return { ok:true, level:level, due:due, interval:interval, lapses:next,
             leech: next >= LEECH && level < MASTER };
  }

  function resetCard(p){
    p = p || {};
    var card = findCard((p.recordId || "").trim());
    if(!card) return { ok:false, message:"缺少卡片标识" };
    var day = p.date || TODAY;
    card.level = 0;
    card.due = day;
    card.lapses = 0;
    return { ok:true, due:day };
  }

  function saveLog(p){
    p = p || {};
    var day = p.date || TODAY;
    var rec = {
      id: "demo-log-" + day,
      date: day,
      minutes: Math.max(0, Math.round(Number(p.minutes || 0) || 0)),
      newCards: Math.max(0, Math.round(Number(p.newCards || 0) || 0)),
      reviews: Math.max(0, Math.round(Number(p.reviews || 0) || 0)),
      quizRate: typeof p.quizRate === "number" ? clamp(p.quizRate, 0, 100) : 0,
      dialogues: typeof p.dialogues === "number" ? clamp(p.dialogues, 0, 99) : 0,
      shadows: typeof p.shadows === "number" ? clamp(p.shadows, 0, 999) : 0,
      done: p.done === "部分完成" ? "部分完成" : "全部完成",
      note: (p.note || "").trim()
    };
    var mode = "created";
    for(var i = 0; i < LOGS.length; i++){
      if(LOGS[i].date === day){ LOGS[i] = rec; mode = "updated"; break; }
    }
    if(mode === "created") LOGS.push(rec);
    return { ok:true, mode:mode, id:rec.id };
  }

  var HANDLERS = {
    get_dashboard: function(p){ return dashboard((p || {}).date); },
    list_cards: listCards,
    get_review_queue: reviewQueue,
    add_card: addCard,
    update_card: updateCard,
    delete_card: deleteCard,
    review_card: reviewCard,
    reset_card: resetCard,
    save_daily_log: saveLog
  };

  function callTool(name, payload){
    var fn = HANDLERS[name];
    if(!fn){
      return Promise.resolve({ isError:true, structuredContent:{ ok:false, message:"演示模式不支持该工具：" + name } });
    }
    try{
      var out = fn(payload || {});
      return Promise.resolve({ isError:false, structuredContent: JSON.parse(JSON.stringify(out)) });
    }catch(err){
      return Promise.resolve({ isError:true, structuredContent:{ ok:false, message:String((err && err.message) || err) } });
    }
  }

  window.__SMART_PAGE__ = { workbench: { callTool: callTool } };

  // 角落提示：这是演示版
  document.addEventListener("DOMContentLoaded", function(){
    var tip = document.createElement("div");
    tip.textContent = "演示版 · 示例数据，不写入资料库";
    tip.style.cssText = "position:fixed;right:10px;bottom:10px;z-index:9999;"
      + "font:12px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;"
      + "color:#4b5563;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;"
      + "padding:4px 10px;opacity:.92;pointer-events:none";
    if(document.body) document.body.appendChild(tip);
  });
})();
</script>

<script data-page-node-id="o4vG1SZMgKdEhm1yGJBa1c" data-pnid-children="ktZDWFkEnGUos4aKnXLsYy">

  var TODAY = (function(){

  ];

  var PLAN = [

  function addDaysKey(key, n){

  function pendingList(){ return store(CACHE_KEYS.pending) || []; }
  function queuePending(name, params){

  function paintOffline(){
    var el = $("#offline-bar");
    if(!el) return;
    var n = pendingList().length;
    if(OFFLINE.on){
      el.innerHTML = '<div class="banner" style="background:#fff8e8;border-color:#f6e0b0;color:#8a5a00">'
        + '离线中：正在用上次同步的数据' + (n ? "，本机还有 " + n + " 条记录待同步" : "")
        + '。联网后刷新会自动补上。</div>';
      return;
    }
    if(n){
      el.innerHTML = '<div class="banner" id="off-b" style="background:#eef4ff;border-color:#d6e2ff;color:#2f4a94;cursor:pointer">'
        + '有 ' + n + ' 条记录还没同步，点这里补上</div>';
      var b = $("#off-b");
      if(b) b.onclick = flushByClick;
      return;
    }
    el.innerHTML = "";
  }

  async function flushByClick(){
    await flushPending();
    try{ await loadDash(); renderView(); }catch(e){}
  }

  async function flushPending(){
    var q = pendingList();
    if(!q.length) return 0;
    var rest = [];
    var okCount = 0;
    for(var i=0;i<q.length;i++){
      try{ await call(q[i].name, q[i].params); okCount += 1; }
      catch(e){ rest.push(q[i]); }
    }
    store(CACHE_KEYS.pending, rest);
    toast(rest.length ? ("还有 " + rest.length + " 条没同步上，过会儿再试") : ("离线记录已同步 " + okCount + " 条"));
    paintOffline();
    return okCount;
  }

  async function call(name, params){
    var api = wb();
    if(!api){
      OFFLINE.on = true;
      throw new Error("当前环境未接入工作台，请在资料库中打开这个页面");
    }
    var payload = Object.assign({}, params||{});
    if(DATE_TOOLS[name] && payload.date === undefined) payload.date = TODAY;
    try{
      var res = await api.callTool(name, payload);
      if(res && res.isError) throw new Error("请求没有成功，请稍后重试");
      if(OFFLINE.on){ OFFLINE.on = false; paintOffline(); }
      return (res && res.structuredContent) || {};
    }catch(err){
      OFFLINE.on = true;
      OFFLINE.reason = (err && err.message) || "网络不可用";
      paintOffline();
      throw err;
    }
  }
  function store(key, val){
    try{
      if(val === undefined) return JSON.parse(localStorage.getItem(key) || "null");
      localStorage.setItem(key, JSON.stringify(val));
    }catch(e){ return null; }
  }

  var audioEl = null;
  var playToken = 0;

  // 有声词典音源：单词为真人录音，整句为其合成音（比系统默认自然）
  function dictUrl(text){
    return "https://dict.youdao.com/dictvoice?type=2&audio=" + encodeURIComponent(String(text));
  }

  function stopAudio(){
    try{ if(audioEl){ audioEl.pause(); audioEl.removeAttribute("src"); audioEl = null; } }catch(e){}
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // 返回 Promise<boolean>：能否播出来
  function playReal(text, rate){
    return new Promise(function(resolve){
      try{
        stopAudio();
        var el = document.createElement("audio");
        audioEl = el;
        if("preservesPitch" in el) el.preservesPitch = true;
        else if("mozPreservesPitch" in el) el.mozPreservesPitch = true;
        else if("webkitPreservesPitch" in el) el.webkitPreservesPitch = true;
        el.preload = "auto";
        el.playbackRate = rate || 1;
        var settled = false;
        function fin(ok){ if(settled) return; settled = true; resolve(ok); }
        el.addEventListener("ended", function(){ fin(true); });
        el.addEventListener("error", function(){ fin(false); });
        setTimeout(function(){ if(!settled && el.readyState < 2) fin(false); }, 3200);
        el.src = dictUrl(text);
        var pr = el.play();
        if(pr && pr.catch) pr.catch(function(){ fin(false); });
      }catch(e){ resolve(false); }
    });
  }

  function ttsVoice(){
    var vs = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    var prefer = ["Samantha","Ava","Allison","Alex","Google US English","Karen","Serena","Daniel"];
    for(var i=0;i<prefer.length;i++){
      var hit = null;
      for(var j=0;j<vs.length;j++){
        if(vs[j].name && vs[j].name.indexOf(prefer[i]) >= 0){ hit = vs[j]; break; }
      }
      if(hit) return hit;
    }
    var enUS = vs.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
    if(enUS.length) return enUS[0];
    var en = vs.filter(function(v){ return /^en/i.test(v.lang); });
    return en.length ? en[0] : null;
  }

  function playTTS(text, rate){
    return new Promise(function(resolve){
      if(!("speechSynthesis" in window) || !text){ resolve(false); return; }
      try{
        var u = new SpeechSynthesisUtterance(String(text));
        u.lang = "en-US";
        u.rate = Math.max(0.45, Math.min(1.1, (rate || 1) * 0.92));
        var v = ttsVoice();
        if(v) u.voice = v;
        var settled = false;
        function fin(ok){ if(settled) return; settled = true; resolve(ok); }
        u.onend = function(){ fin(true); };
        u.onerror = function(){ fin(false); };
        setTimeout(function(){ fin(true); }, 12000);
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      }catch(e){ resolve(false); }
    });
  }

  // 统一入口：真人音优先，失败自动回落系统语音
  function speak(text, rate){
    if(!text) return Promise.resolve(false);
    var r = rate === undefined ? AUDIO.rate : rate;
    if(AUDIO.src === "real"){
      return playReal(text, r).then(function(ok){
        return ok ? true : playTTS(text, r);
      });
    }
    return playTTS(text, r);
  }

  function wordsOf(text){
    return String(text).replace(/[.,!?;:"“”'’]/g, " ").split(/\s+/).filter(Boolean);
  }

  // 拆词跟读：一个词一个词放，最后整句连起来
  async function speakChunk(text){
    var token = ++playToken;
    var ws = wordsOf(text);
    if(ws.length < 2){ await speak(text); return; }
    for(var i=0;i<ws.length;i++){
      if(token !== playToken) return;
      await speak(ws[i]);
      if(token !== playToken) return;
      await wait(AUDIO.rate < 1 ? 560 : 420);
    }
    await wait(200);
    if(token !== playToken) return;
    await speak(text);
  }

  var REC = { stream: null, mr: null, chunks: [], url: "", btn: null, blocked: "" };

  function recSupported(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  }

  function pickMime(){
    var list = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/aac", "audio/ogg"];
    if(!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for(var i = 0; i < list.length; i++){
      if(MediaRecorder.isTypeSupported(list[i])) return list[i];
    }

  }

  // 先判断"能不能有麦克风"：预览容器（iframe）没给 allow="microphone" 时，
  // 浏览器会直接拒绝，和用户自己的权限设置无关
  function micBlockedReason(){
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "noapi";
      var fp = document.featurePolicy || document.permissionsPolicy;
      if(fp && fp.allowsFeature && !fp.allowsFeature("microphone")) return "policy";
    }catch(e){}
    return "";
  }

  function micErrorText(err){
    var name = (err && err.name) || "";
    var framed = window.self !== window.top;
    if(name === "NotAllowedError" || name === "SecurityError"){
      return framed
        ? "这个预览窗口没有开放麦克风，不是你浏览器的设置问题"
        : "浏览器拒绝了麦克风，去地址栏权限里允许后重试";
    }
    if(name === "NotFoundError" || name === "DevicesNotFoundError") return "没找到麦克风设备";
    if(name === "NotReadableError") return "麦克风被别的程序占用了";
    if(name === "AbortError") return "麦克风被系统打断了";
    return "麦克风打不开" + (name ? "（" + name + "）" : "");
  }

  // 麦克风不可用时的替代练法：示范 → 3 秒跟读窗口 → 再示范
  async function shadowRead(text, why){
    var token = ++playToken;
    toast((why ? why + "，" : "") + "改用跟读节拍：听一遍，跟着读");
    await speak(text);
    if(token !== playToken) return;
    for(var i = 3; i > 0; i--){
      paintRecLine("跟着读　" + i + " …");
      await wait(720);
      if(token !== playToken){ paintRecLine(); return; }
    }
    await speak(text);
    if(token !== playToken) return;
    bumpShadow();
    paintRecLine();
    toast("读完这一句了。自己再念一遍，比多听十遍管用");
  }

  function releaseStream(){
    try{ if(REC.stream) REC.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    REC.stream = null;
  }

  async function toggleRec(text, btn){
    if(REC.mr && REC.mr.state === "recording"){ stopRec(); return; }
    var pre = micBlockedReason();
    if(pre === "noapi"){
      REC.blocked = "noapi";
      await shadowRead(text, "这个浏览器不支持录音");
      return;
    }
    if(pre === "policy"){
      REC.blocked = "policy";
      await shadowRead(text, "这个预览窗口没开放麦克风");
      return;
    }
    try{
      REC.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }catch(err){
      REC.blocked = (err && err.name) || "error";
      await shadowRead(text, micErrorText(err));
      return;
    }
    REC.chunks = [];
    REC.btn = btn;
    var mime = pickMime();
    try{
      REC.mr = mime ? new window.MediaRecorder(REC.stream, { mimeType: mime }) : new window.MediaRecorder(REC.stream);
    }catch(e){
      toast("录音启动失败，换个浏览器试试");
      releaseStream();
      return;
    }
    REC.mr.ondataavailable = function(ev){ if(ev.data && ev.data.size) REC.chunks.push(ev.data); };
    REC.mr.onstop = function(){ finishRec(text); };
    REC.blocked = "";
    paintRecLine();
    REC.mr.start();
    btn.setAttribute("data-label", btn.textContent);
    btn.classList.add("mic-live");
    btn.textContent = "● 停止";
    setTimeout(function(){ if(REC.mr && REC.mr.state === "recording") stopRec(); }, 8000);
    toast("开始录音，读完点「停止」");
  }

  function stopRec(){
    try{ if(REC.mr && REC.mr.state === "recording") REC.mr.stop(); }catch(e){}
  }

  async function finishRec(text){
    releaseStream();
    if(REC.btn){
      REC.btn.classList.remove("mic-live");
      REC.btn.textContent = REC.btn.getAttribute("data-label") || "🎤 跟读";
    }
    if(!REC.chunks.length){ toast("没录到声音，再试一次"); return; }
    if(REC.url){ try{ URL.revokeObjectURL(REC.url); }catch(e){} }
    var type = REC.chunks[0].type || "audio/webm";
    REC.url = URL.createObjectURL(new window.Blob(REC.chunks, { type: type }));
    toast("示范 → 你的 → 示范，听听差别");
    await speak(text);
    await wait(320);
    await playOwnRec();
    await wait(280);
    await speak(text);
  }

  function playOwnRec(){
    return new Promise(function(resolve){
      if(!REC.url){ resolve(false); return; }
      try{
        stopAudio();
        var el = document.createElement("audio");
        el.src = REC.url;
        var settled = false;
        var fin = function(v){ if(!settled){ settled = true; resolve(v); } };
        el.addEventListener("ended", function(){ fin(true); });
        el.addEventListener("error", function(){ fin(false); });
        setTimeout(function(){ if(!settled && el.readyState < 1) fin(false); }, 2500);
        var pr = el.play();
        if(pr && pr.catch) pr.catch(function(){ fin(false); });
      }catch(e){ resolve(false); }
    });
  }

  var QPAIRS = [["sheep","ship"],["bed","bad"],["cart","cut"],["caught","cot"],["full","fool"],["bird","bud"],["day","die"]];
  var QUIZ = { qs: [], idx: 0, right: 0, wrongs: [], lock: false };

  function shuffleArr(a){
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildQuiz(n){
    var pool = shuffleArr(QPAIRS.slice());
    var qs = [];
    for(var i = 0; i < n; i++){
      var pair = pool[i % pool.length];
      var flip = Math.random() < 0.5;
      var opts = flip ? [pair[1], pair[0]] : [pair[0], pair[1]];
      qs.push({ opts: opts, answer: Math.random() < 0.5 ? 0 : 1 });
    }
    return qs;
  }

  function resetQuiz(){
    QUIZ = { qs: buildQuiz(10), idx: 0, right: 0, wrongs: [], lock: false };

  async function answerQuiz(pick){
    if(QUIZ.lock) return;
    var q = QUIZ.qs[QUIZ.idx];

    QUIZ.lock = true;
    var ok = (pick === q.answer);

  /* ---------------- review view ---------------- */
  async function renderReview(){
    var view = $("#view");
    view.innerHTML = '<div class="flash-wrap"><div class="skel" style="height:290px"></div></div>';
    try{
      var data = await call("get_review_queue", {date: TODAY, limit: 30});
      state.review = {queue: data.cards || [], idx:0, flipped:false, again:0, hard:0, good:0, finished:false, total: data.total};
      store(CACHE_KEYS.queue, data.cards || []);
    }catch(e){
      var cachedQ = store(CACHE_KEYS.queue);
      if(!cachedQ || !cachedQ.length){
        view.innerHTML = '<div class="empty"><div class="ic">⚠️</div>' + escapeHtml(e.message) + '</div>';
        return;
      }
      state.review = {queue: cachedQ, idx:0, flipped:false, again:0, hard:0, good:0, finished:false, total: cachedQ.length};
      if(!OFFLINE.on){ OFFLINE.on = true; paintOffline(); }
    }
    paintReview();
  }

  function paintReview(){
    var r = state.review;
    var view = $("#view");
    if(!r.queue.length){
      view.innerHTML = '<div class="flash-wrap"><div class="panel" style="text-align:center;padding:46px 24px">'
        + '<div style="font-size:34px;margin-bottom:10px">🌤</div>'
        + '<div style="font-size:16px;font-weight:600;margin-bottom:6px">今天没有到期的卡片</div>'
        + '<div class="muted" style="font-size:13px;margin-bottom:18px">艾宾浩斯告诉我：休息也是学习的一部分。</div>'
        + '<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">'
        + '<button class="btn" id="to-deck">去卡片库加几张</button>'
        + '<button class="btn primary" id="to-today">回今日任务</button></div>'
        + '</div></div>';
      $("#to-deck").onclick = function(){ switchView("deck"); };
      $("#to-today").onclick = function(){ switchView("today"); };
      return;
    }
    if(r.idx >= r.queue.length || r.finished){ paintSummary(); return; }

    var c = r.queue[r.idx];
    var total = r.queue.length;
    var pct = Math.round(r.idx / total * 100);
    var dots = "";
    for(var i=0;i<6;i++){ dots += '<i class="' + (i < c.level ? "on" : "") + '"></i>'; }

    var back = r.flipped;
    var pair = (!back && c.type === "音标") ? pairOf(c) : null;
    var sample = (!back && c.type === "音标") ? sampleOf(c) : "";
    var speakTarget = sample || c.content;
    var pairHtml = pair
      ? '<div class="pairbox">'
        + '<div class="plabel">辨音对比（零基础最容易混）：A、B 各听一遍，再听一遍找差别</div>'
        + '<div class="prow">'
        +   '<button class="speak" data-pair="' + escapeHtml(pair[0]) + '">A · ' + escapeHtml(pair[0]) + '</button>'
        +   '<button class="speak" data-pair="' + escapeHtml(pair[1]) + '">B · ' + escapeHtml(pair[1]) + '</button>'
        + '</div></div>'
      : '';
    var html = '<div class="flash-wrap">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px">'
      +   '<div class="muted" style="font-size:12.5px">第 ' + (r.idx+1) + ' / ' + total + ' 张</div>'
      +   '<div style="display:flex;gap:12px;font-size:12px;color:var(--muted)">'
      +     '<span>忘记 ' + r.again + '</span><span>模糊 ' + r.hard + '</span><span>记得 ' + r.good + '</span>'
      +   '</div>'
      + '</div>'
      + '<div class="progress-line"><i style="width:' + pct + '%"></i></div>'
      + '<div class="flash" id="flash">'
      +   '<div class="badge">' + escapeHtml(c.type || "卡片") + (c.stage ? " · " + escapeHtml(c.stage) : "") + '</div>'
      +   '<div class="lv">' + dots + '</div>'
      +   (back
            ? '<div class="mean">' + escapeHtml(c.meaning) + '</div>'
              + (c.example ? '<div class="ex"><b>' + escapeHtml(c.example) + '</b>' + escapeHtml(c.exampleCn) + '</div>' : '')
              + '<div class="hint">点卡片可翻回正面</div>'
            : '<div class="word">' + escapeHtml(c.content) + '</div>'
              + (c.ipa ? '<div class="ipa">' + escapeHtml(c.ipa) + '</div>' : '')
              + (sample ? '<div class="sampleword">例词：<b>' + escapeHtml(sample) + '</b></div>' : '')
              + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
              +   '<button class="speak" id="play">🔊 ' + (sample ? '听 ' + escapeHtml(sample) : '听发音') + '</button>'
              +   (c.example ? '<button class="speak" id="play-ex">整句</button>' : '')
              +   (c.example ? '<button class="speak" id="play-chunk">拆词</button>' : '')
              +   '<button class="speak" data-rec="' + escapeHtml(speakTarget) + '">🎤 跟读</button>'
              + '</div>'
              + pairHtml
              + '<div class="hint">点击卡片看中文</div>')
      + '</div>'
      + (back
          ? '<div class="grades">'
            + '<button class="grade g1" data-g="again">忘了<small>今天再来</small></button>'
            + '<button class="grade g2" data-g="hard">勉强<small>短期再见</small></button>'
            + '<button class="grade g3" data-g="good">记得<small>按计划复习</small></button>'
            + '</div>'
          : '<div style="margin-top:16px;display:flex;gap:9px">'
            + '<button class="btn full" id="flip">看中文 / 看提示</button>'
            + '<button class="btn primary" id="flip2" style="flex:0 0 auto">我认得</button>'
            + '</div>')
      + '</div>';

    view.innerHTML = html;
    $("#flash").addEventListener("click", function(e){
      if(e.target.closest(".speak")) return;
      state.review.flipped = !state.review.flipped;
      paintReview();
    });
    var play = $("#play");
    if(play) play.addEventListener("click", function(e){ e.stopPropagation(); speak(speakTarget); });
    var playEx = $("#play-ex");
    if(playEx) playEx.addEventListener("click", function(e){ e.stopPropagation(); speak(c.example); });
    var playChunk = $("#play-chunk");
    if(playChunk) playChunk.addEventListener("click", function(e){ e.stopPropagation(); speakChunk(c.example); });
    $$("[data-pair]").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        speakChunkOnPair(b.getAttribute("data-pair"));
      });
    });
    bindRecButtons();
    if(!back){
      $("#flip").onclick = function(){ state.review.flipped = true; paintReview(); };
      $("#flip2").onclick = function(){ grade("good"); };
    } else {
      $$("[data-g]").forEach(function(b){
        b.onclick = function(){ grade(b.getAttribute("data-g")); };
      });
    }
  }

  // 辨音对比：先正常念一次，稍停，再慢速念一次
  async function speakChunkOnPair(word){
    await speak(word);
    await wait(320);
    await speak(word, 0.6);
  }

  async function grade(g){
    var r = state.review;
    var c = r.queue[r.idx];
    if(!c) return;
    if(g === "again") r.again++; else if(g === "hard") r.hard++; else r.good++;
    state.session.reviews += 1;
    r.idx += 1;
    r.flipped = false;
    paintReview();
    var payload = {date: TODAY, recordId: c.id, level: c.level, grade: g, lapses: c.lapses || 0};
    try{
      var res = await call("review_card", payload);
      if(res && res.leech) toast("这张进弱项池了，之后单独练");
    }catch(e){
      queuePending("review_card", payload);
      paintOffline();
      toast("这张先记在本机，联网后自动同步");
    }
  }

  function paintDeck(){
    var st = state.deck;
    var typeChips = ['<button class="fchip' + (st.type === "" ? " on" : "") + '" data-t="">全部</button>']
      .concat(TYPES.map(function(t){
        return '<button class="fchip' + (st.type === t ? " on" : "") + '" data-t="' + t + '">' + t + '</button>';
      })).join("");

    var capMax = (state.dash && state.dash.stats && state.dash.stats.dailyCap) ? state.dash.stats.dailyCap : DAILY_CAP;
    var capAdded = (state.dash && state.dash.stats && state.dash.stats.todayAdded) ? state.dash.stats.todayAdded : 0;
    var capPct = Math.min(100, Math.round(capAdded / capMax * 100));
    var capHtml = '<div class="capbar' + (capAdded >= capMax ? " warn" : "") + '">'
      + '<span>今日新卡 ' + capAdded + ' / ' + capMax + '</span>'
      + '<span class="track"><i style="width:' + capPct + '%"></i></span>'
      + '<span>' + (capAdded >= capMax ? "到上限了，明天再加" : "还能加 " + (capMax - capAdded) + " 张") + '</span>'
      + '</div>';

    var rows = st.items.map(function(c){
      var dueLabel = !c.due ? "待安排" : (c.due <= TODAY ? "今天到期" : fmtDate(c.due));
      var dueCls = (c.due && c.due <= TODAY) ? " due-txt now" : " due-txt";
      var dots = "";
      for(var i=0;i<6;i++){ dots += '<i class="' + (i < c.level ? "on" : "") + '"></i>'; }
      return '<div class="card-row">'
        + '<div class="main">'
        +   '<div class="c1">' + escapeHtml(c.content)
        +     '<span class="tag ' + (TYPE_CLASS[c.type] || "") + '">' + escapeHtml(c.type || "卡片") + '</span>'
        +   '</div>'
        +   '<div class="c2">' + escapeHtml(c.meaning) + (c.ipa ? " · " + escapeHtml(c.ipa) : "") + '</div>'
        + '</div>'
        + '<div class="dots">' + dots + '</div>'
        + '<div class="' + dueCls.slice(1) + '">' + escapeHtml(dueLabel) + '</div>'
        + '<button class="ico-btn" data-edit="' + escapeHtml(c.id) + '" title="编辑">'
        +   '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 20h4l10-10-4-4L4 16v4z"/></svg>'
        + '</button>'
        + '<button class="ico-btn" data-del="' + escapeHtml(c.id) + '" title="删除">'
        +   '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>'
        + '</button>'
        + '</div>';
    }).join("");

    var html = '<div class="panel">'
      + '<div class="toolbar">'
      +   '<input type="text" id="q" placeholder="搜索单词、释义或音标" value="' + escapeHtml(st.keyword) + '">'
      +   typeChips
      +   '<button class="fchip' + (st.onlyDue ? " on" : "") + '" id="due-toggle">只看今天到期</button>'
      +   '<div style="flex:1"></div>'
      +   '<button class="btn primary sm" id="add">+ 新增卡片</button>'
      + '</div>'
      + capHtml
      + '<div class="sec-title">共 ' + st.total + ' 张，当前显示 ' + st.items.length + ' 张</div>'
      + (st.items.length ? rows : '<div class="empty"><div class="ic">🗂</div>没有符合条件的卡片</div>')
      + (st.offset + st.items.length < st.total

    $("#q").addEventListener("input", function(e){

  function openEditor(card){
    var isNew = !card;
    var c = card || {content:"",meaning:"",type:"单词",stage:"W2 高频词",ipa:"",example:"",exampleCn:""};
    var root = $("#modal-root");
    root.innerHTML = '<div class="mask" id="mask"><div class="modal">'
      + '<h3>' + (isNew ? "新增卡片" : "编辑卡片") + '</h3>'
      + '<div class="field"><label>英文内容 *</label><input type="text" id="f-content" value="' + escapeHtml(c.content) + '" placeholder="例：Where is the toilet?"></div>'
      + '<div class="field"><label>中文释义</label><input type="text" id="f-meaning" value="' + escapeHtml(c.meaning) + '" placeholder="例：洗手间在哪里？"></div>'
      + '<div class="row">'
      +   '<div class="field"><label>类型</label><select id="f-type">'
      +     TYPES.map(function(t){ return '<option' + (c.type === t ? " selected" : "") + '>' + t + '</option>'; }).join("")
      +   '</select></div>'
      +   '<div class="field"><label>阶段</label><select id="f-stage">'
      +     STAGES.map(function(t){ return '<option' + (c.stage === t ? " selected" : "") + '>' + t + '</option>'; }).join("")
      +   '</select></div>'
      + '</div>'
      + '<div class="field"><label>音标</label><input type="text" id="f-ipa" value="' + escapeHtml(c.ipa) + '" placeholder="例：/weə ɪz ðə ˈtɔɪlət/"></div>'
      + '<div class="field"><label>例句</label><input type="text" id="f-ex" value="' + escapeHtml(c.example) + '"></div>'
      + '<div class="field"><label>例句翻译</label><input type="text" id="f-excn" value="' + escapeHtml(c.exampleCn) + '"></div>'
      + '<div class="foot"><button class="btn ghost" id="cancel">取消</button><button class="btn primary" id="ok">' + (isNew ? "创建" : "保存") + '</button></div>'
      + '</div></div>';
    $("#cancel").onclick = function(){ root.innerHTML = ""; };
    $("#mask").addEventListener("click", function(e){ if(e.target.id === "mask") root.innerHTML = ""; });
    $("#ok").onclick = async function(){
      var content = $("#f-content").value.trim();
      if(!content){ toast("英文内容不能为空"); return; }
      var payload = {
        content: content,
        meaning: $("#f-meaning").value.trim(),
        type: $("#f-type").value,
        stage: $("#f-stage").value,
        ipa: $("#f-ipa").value.trim(),
        example: $("#f-ex").value.trim(),
        exampleCn: $("#f-excn").value.trim()
      };
      var btn = $("#ok");
      btn.disabled = true; btn.textContent = "保存中…";
      try{
        if(isNew){
          var addRes = await call("add_card", Object.assign({date: TODAY}, payload));
          if(addRes && addRes.capped){
            root.innerHTML = "";
            askOverCap(payload);
            return;
          }
          state.session.newCards += 1;
        } else {
          await call("update_card", Object.assign({recordId: c.id}, payload));
        }
        root.innerHTML = "";
        toast(isNew ? "已加入卡片库，今天就能复习" : "已保存");
        await loadDash();
        renderDeck();
      }catch(e){
        toast(e.message || "保存失败");
        btn.disabled = false; btn.textContent = isNew ? "创建" : "保存";
      }
    };
  }

    root.innerHTML = '<div class="mask" id="mask"><div class="modal">'

  /* ---------------- 音标入门 ---------------- */
  async function playPhPair(sym){
    var pr = phPair(sym);
    if(!pr){ return; }
    toast("先听 " + pr[0] + "，再听 " + pr[1] + "，注意区别");
    await speak(pr[0]);
    await wait(300);
    await speak(pr[1]);
    await wait(460);
    await speak(pr[0]);
    await wait(300);
    await speak(pr[1]);
  }

  function renderPhonics(){
    var gi = state.phGroup;
    if(typeof gi !== "number"){
      gi = 0;
      for(var i=0;i<PH_GROUPS.length;i++){
        var gg = phGroupGot(i);
        if(gg.got < gg.total){ gi = i; break; }
        gi = 0;
      }
      state.phGroup = gi;
    }
    var got = phCount(), total = PHONEMES.length;
    var pct = Math.round(got / total * 100);
    var gil = phGroupGot(gi);
    var list = PHONEMES.filter(function(p){ return p.g === gi; });
    var gotMap = phGot();

    var tabsHtml = PH_GROUPS.map(function(g,i){
      var s = phGroupGot(i);
      return '<button class="ph-gtab' + (i === gi ? " on" : "") + '" data-phg="' + i + '">'
        + escapeHtml(g.short) + " " + s.got + "/" + s.total + '</button>';
    }).join("");

    var cardsHtml = list.map(function(p){
      var ok = !!gotMap[p.s];
      var pr = phPair(p.s);
      return '<div class="ph-card' + (ok ? " got" : "") + '">'
        + (ok ? '<span class="ok">✓</span>' : "")
        + '<div class="sym">' + escapeHtml(p.s) + '</div>'
        + '<span class="cn">' + escapeHtml(p.cn) + '</span>'
        + '<div class="word">' + escapeHtml(p.w) + '<span class="wz">' + escapeHtml(p.z) + '</span></div>'
        + '<div class="tip">' + escapeHtml(p.tip) + '</div>'
        + '<div class="acts">'
        +   '<button class="btn" data-speak="' + escapeHtml(p.w) + '">听例词</button>'
        +   '<button class="btn" data-rec="' + escapeHtml(p.w) + '">跟读</button>'
        +   (pr ? '<button class="btn" data-phpair="' + escapeHtml(p.s) + '">辨</button>' : "")
        +   '<button class="btn" data-phmark="' + escapeHtml(p.s) + '">' + (ok ? "取消" : "我会了") + '</button>'
        + '</div>'
        + '</div>';
    }).join("");

    var html = '<div class="panel">'
      + '<div class="ph-head">'
      +   '<div class="big">' + got + '<small> / ' + total + ' 已掌握</small></div>'
      +   '<div class="muted" style="font-size:12px;text-align:right">不会写符号没关系<br>能听出来、能发出来就算会</div>'
      + '</div>'
      + '<div class="progress-line"><i style="width:' + pct + '%"></i></div>'
      + '<div class="note" style="background:var(--brand-soft);border-left:3px solid var(--brand);padding:11px 14px;border-radius:0 10px 10px 0;font-size:13px;color:#3f3a8f;line-height:1.75">'
      +   '音标不是要背的字母表，是一套「怎么发音」的说明书。零基础最快的一条路：<b>先只学短元音 7 个</b>，把 sit / bed / cat / cup / hot / book / about 听准读准，剩下的都是在这基础上加减。'
      + '</div>'
      + '<div class="sec-title" style="margin-bottom:8px">每天只练一组，练完勾「我会了」；5 组走完一遍大约 6 天</div>'
      + '<div class="ph-groups">' + tabsHtml + '</div>'
      + '<div class="muted" style="font-size:12px;margin-bottom:4px">'
      +   escapeHtml(PH_GROUPS[gi].name) + ' · 本组 ' + gil.got + '/' + gil.total + ' · ' + escapeHtml(PH_GROUPS[gi].sub)
      + '</div>'
      + '<div class="recline" id="rec-line" style="margin-bottom:10px"></div>'
      + '<div class="ph-grid">' + cardsHtml + '</div>'
      + '<div class="divider"></div>'
      + '<h3 style="font-size:14px;margin:0 0 8px">一个字都不会读的时候，跟着这个顺序走</h3>'
      + '<ul class="guide" style="padding-left:18px;margin:0">'
      +   '<li style="font-size:13px;color:var(--ink2);line-height:1.8"><b>1. 先听</b>：点「听例词」，把 7 个短元音听一遍。听不懂也没关系，先让耳朵熟悉。</li>'
      +   '<li style="font-size:13px;color:var(--ink2);line-height:1.8"><b>2. 再对比</b>：有「辨」按钮的音，点一下会连着放两个容易混的词（比如 ship / sheep），听 3 遍再跟读。</li>'
      +   '<li style="font-size:13px;color:var(--ink2);line-height:1.8"><b>3. 后跟读</b>：点「跟读」，先听示范，跟着节拍读一遍。读错不会有任何惩罚，出声就算成功。</li>'
      +   '<li style="font-size:13px;color:var(--ink2);line-height:1.8"><b>4. 最后勾</b>：能听出区别、能读出来，就点「我会了」。不确定就先留着，明天再来。</li>'
      + '</ul>'
      + '<div class="note" style="background:#fff9ec;border-left:3px solid var(--amber);padding:11px 14px;border-radius:0 10px 10px 0;font-size:12.5px;color:#7a5300;margin:14px 0 0;line-height:1.7">'
      +   '不用怕记混。中文里没有 /θ/ /ð/ /ɪ/ 这些音，一开始分不清是正常的——这不是你笨，是母语里没有这个格子。练到能听出差别就够了，符号记不住可以随时回来查。'
      + '</div>'
      + '</div>';

    $("#view").innerHTML = html;

    $$("[data-phg]").forEach(function(b){
      b.onclick = function(){
        state.phGroup = Number(b.getAttribute("data-phg"));
        renderPhonics();
      };
    });
    $$("[data-speak]").forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); speak(b.getAttribute("data-speak")); };
    });
    $$("[data-phpair]").forEach(function(b){
      b.onclick = function(e){ e.stopPropagation(); playPhPair(b.getAttribute("data-phpair")); };
    });
    $$("[data-phmark]").forEach(function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var sym = b.getAttribute("data-phmark");
        var wasOn = !!phGot()[sym];
        phToggle(sym);
        renderPhonics();
        toast(wasOn ? "已取消 " + sym : "记下了 " + sym + "，这个音算你的了");
      };
    });
    bindRecButtons();
    paintRecLine();
  }

      +   '<li><b>只背不用</b>：每个词至少说一句和自己有关的话，否则记不住。</li>'
      +   '<li><b>追求一次记住</b>：遗忘是正常的，靠复习次数解决，不靠意志力。</li>'
      +   '<li><b>一开始就学语法体系</b>：先有 50 个能用的句子，再回头看语法，效率高得多。</li>'
      +   '<li><b>怕说错</b>：记住那句 <b>I\'m learning English.</b>，说错时它就是你的免死金牌。</li>'
      +   '<li><b>资料收集癖</b>：收藏 20 个 app 不如把这一套卡片刷完。</li>'
      + '</ul>'
      + '<h3>免费资源（按顺序用，不要同时开三个）</h3>'
      + '<ul>'
      +   '<li><b>发音</b>：BBC Learning English 的发音入门视频，跟着口型练。</li>'
      +   '<li><b>听力</b>：从「慢速英语」开始，每天 5 分钟，听懂 60% 就够。</li>'
      +   '<li><b>跟读</b>：用手机自带语音朗读，读一句跟一句，比看视频有效。</li>'
      + '</ul>'
      + '<h3>弱项池：反复忘的卡要单独处理</h3>'
      + '<p>一张卡评「忘了」累计 2 次，会自动进「弱项池」。这里不推新卡，只做认读：看英文想中文，认得就移出，认不得就留着。反复忘通常不是复习不够，而是没有一个能挂住的钩子——给它造一个和你有关的短句。</p>'
      + '<h3>对话演练：把句子放进场景</h3>'
      + '<p>「对话」标签里有 6 段真实场景：见面、买东西、听不懂救场、点单、问路、住酒店。先用「跟读」把每句念顺，再用「角色扮演」盖住英文说一遍。两个角色都演过，才算真的会。</p>'
      + '<h3>每天最多加 8 张新卡</h3>'
      + '<p>零基础最容易一天加 50 张，然后第三天全崩。到 8 张会拦一下，想加要再确认一次。新卡少而稳，比多而乱有用得多。</p>'
      + '<h3>离线与同步</h3>'
      + '<p>页面会缓存上次同步的数据。断网时仍能刷卡、评分，评分先存在本机，联网后自动补上；卡片库、打卡这类必须联网的操作会提示失败。</p>'
      + '<div class="note">这份指南会一直在「入门指南」标签里。等你走完 30 天，可以回来把它改成第二阶段（比如每天 10 分钟听力 + 一段真实对话）。</div>'
      + '</div>';
    $("#view").innerHTML = html;
    var gph = $("#guide-phonics");
    if(gph) gph.onclick = function(){ switchView("phonics"); };
  }

  /* ---------------- 弱项池 ---------------- */
  async function renderLeech(){
    var view = $("#view");
    view.innerHTML = '<div class="skel" style="height:88px;margin-bottom:12px"></div><div class="skel" style="height:250px"></div>';
    var cards = [];
    try{
      var data = await call("list_cards", {date: TODAY, leechOnly: true, limit: 50});
      cards = data.cards || [];
      store(CACHE_KEYS.cards, cards);
    }catch(e){
      cards = store(CACHE_KEYS.cards) || [];
      OFFLINE.on = true;
      paintOffline();
    }
    state.leech = {cards: cards, idx: 0, mode: "list", flipped: false, cleared: 0};
    paintLeech();
  }

  function paintLeech(){
    var st = state.leech;
    var view = $("#view");
    if(!st.cards.length){
      view.innerHTML = '<div class="flash-wrap"><div class="panel" style="text-align:center;padding:44px 22px">'
        + '<div style="font-size:32px;margin-bottom:8px">🌱</div>'
        + '<div style="font-size:16px;font-weight:600">弱项池是空的</div>'
        + '<div class="muted" style="font-size:13px;margin:8px 0 18px;line-height:1.8">卡片评「忘了」累计 2 次，会自动进到这里。现在没有，说明还没有反复卡住的卡。</div>'
        + '<button class="btn primary" id="l-back">回今日</button></div></div>';
      $("#l-back").onclick = function(){ switchView("today"); };
      return;
    }
    if(st.mode === "drill"){
      var c = st.cards[st.idx];
      if(!c){ st.mode = "list"; paintLeech(); return; }
      var sample = sampleOf(c);
      var target = sample || c.content;
      view.innerHTML = '<div class="flash-wrap"><div class="panel" style="padding:16px 0 0">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 18px">'
        +   '<div class="muted" style="font-size:12.5px">弱项 ' + (st.idx + 1) + ' / ' + st.cards.length + '</div>'
        +   '<div class="tag leech">忘了 ' + c.lapses + ' 次</div>'
        + '</div>'
        + '<div class="flash" id="flash" style="box-shadow:none;border:0">'
        +   '<div class="badge">' + escapeHtml(c.type || "卡片") + '</div>'
        +   (st.flipped
              ? '<div class="mean">' + escapeHtml(c.meaning) + '</div>'
                + (c.example ? '<div class="ex"><b>' + escapeHtml(c.example) + '</b>' + escapeHtml(c.exampleCn) + '</div>' : '')
                + '<div class="hint">点卡片可翻回正面</div>'
              : '<div class="word">' + escapeHtml(c.content) + '</div>'
                + (c.ipa ? '<div class="ipa">' + escapeHtml(c.ipa) + '</div>' : '')
                + '<div style="display:flex;gap:8px;justify-content:center;margin-top:14px">'
                +   '<button class="speak" id="l-play">🔊 ' + (sample ? "听 " + escapeHtml(sample) : "听发音") + '</button>'
                +   '<button class="speak" id="l-chunk">拆词</button>'
                + '</div>'
                + '<div class="hint">先自己想中文，再点卡片看答案</div>')
        + '</div>'
        + '<div style="padding:0 18px 18px"><div class="grades two">'
        +   '<button class="grade g1" id="l-no">还是不行<small>留在池里</small></button>'
        +   '<button class="grade g3" id="l-yes">这次认得了<small>移出池子</small></button>'
        + '</div></div></div></div>';
      $("#flash").onclick = function(e){ if(e.target.closest(".speak")) return; st.flipped = !st.flipped; paintLeech(); };
      $("#l-play").onclick = function(e){ e.stopPropagation(); speak(target); };
      $("#l-chunk").onclick = function(e){ e.stopPropagation(); speakChunk(c.example || c.content); };
      $("#l-no").onclick = function(){ nextLeech(); };
      $("#l-yes").onclick = function(){ clearLeech(c); };
      return;
    }
    var rows = st.cards.map(function(c, i){
      return '<div class="leech-row">'
        + '<div class="lmain">'
        +   '<div class="len">' + escapeHtml(c.content)
        +     '<span class="tag leech">忘了 ' + c.lapses + ' 次</span>'
        +     '<span class="tag ' + (TYPE_CLASS[c.type] || "") + '">' + escapeHtml(c.type || "卡片") + '</span>'
        +   '</div>'
        +   '<div class="lcn">' + escapeHtml(c.meaning) + (c.ipa ? " · " + escapeHtml(c.ipa) : "") + '</div>'
        + '</div>'
        + '<button class="btn sm" data-drill="' + i + '">单独练</button>'
        + '</div>';
    }).join("");
    view.innerHTML = '<div class="panel">'
      + '<h2><span class="dot"></span>弱项池 · ' + st.cards.length + ' 张</h2>'
      + '<div class="muted" style="font-size:12.5px;line-height:1.8;margin-bottom:10px">这些卡反复忘，说明不是「没复习」，而是「没记住」。单独练只做认读：看英文想中文，认得就移出池子，不认得就留着。这时候先别再加新卡。</div>'
      + rows
      + '</div>';
    $$("[data-drill]").forEach(function(b){
      b.onclick = function(){
        st.idx = Number(b.getAttribute("data-drill"));
        st.mode = "drill";
        st.flipped = false;
        paintLeech();
      };
    });
  }

  function nextLeech(){
    var st = state.leech;
    st.idx += 1;
    st.flipped = false;
    if(st.idx >= st.cards.length){
      st.mode = "list";
      toast("这一轮练完了，没记住的还留在池里，明天继续");
    }
    paintLeech();
  }

  async function clearLeech(c){
    var st = state.leech;
    try{
      await call("update_card", {recordId: c.id, level: 1, lapses: 0, due: addDaysKey(TODAY, 1)});
      toast("移出弱项池，明天再复习一次");
    }catch(e){
      toast("没保存上，稍后重试");
    }
    st.cards = st.cards.filter(function(x){ return x.id !== c.id; });
    st.cleared += 1;
    st.flipped = false;
    if(st.idx >= st.cards.length) st.mode = "list";
    paintLeech();
    loadDash().catch(function(){});
  }

  /* ---------------- 对话演练 ---------------- */
  function dlgDoneToday(){ return store("enwb.dlg." + TODAY) || []; }
  function dlgTotalMap(){ return store("enwb.dlgTotal") || {}; }
  function quizToday(){ return store("enwb.quiz." + TODAY) || null; }

  function dlgById(id){
    for(var i = 0; i < DIALOGUES.length; i++){ if(DIALOGUES[i].id === id) return DIALOGUES[i]; }
    return null;
  }

  function markDlgDone(id){
    var arr = dlgDoneToday();
    if(arr.indexOf(id) < 0) arr.push(id);
    store("enwb.dlg." + TODAY, arr);
    var total = dlgTotalMap();
    total[id] = (total[id] || 0) + 1;
    store("enwb.dlgTotal", total);
  }

  function recommendDialog(){
    var done = dlgDoneToday();
    var left = DIALOGUES.filter(function(d){ return done.indexOf(d.id) < 0; });
    var pool = left.length ? left : DIALOGUES;
    var dayIdx = (state.dash && state.dash.dayIndex) || 1;
    return pool[(dayIdx - 1) % pool.length];
  }

  function startDialog(id){
    state.dialog = {id:id, mode:"read", role:"B", idx:0, reveal:false};
    state.view = "dialog";
    $$(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-view") === "dialog"); });
    renderDialogScene();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderDialog(){
    var done = dlgDoneToday();
    var total = dlgTotalMap();
    var cards = DIALOGUES.map(function(d){
      var isDone = done.indexOf(d.id) >= 0;
      var times = total[d.id] || 0;
      return '<div class="dlg-card" data-dlg="' + d.id + '">'
        + '<div class="dt">' + escapeHtml(d.title) + (isDone ? '<span class="tag t2">今天练过</span>' : '') + '</div>'
        + '<div class="ds">' + escapeHtml(d.scene) + '</div>'
        + '<div class="dm">' + escapeHtml(d.roles.A) + ' × ' + escapeHtml(d.roles.B) + ' · ' + d.lines.length + ' 句'
        +   (times ? " · 累计 " + times + " 遍" : "") + '</div>'
        + '</div>';
    }).join("");
    $("#view").innerHTML = '<div class="panel">'
      + '<h2><span class="dot"></span>场景对话演练</h2>'
      + '<div class="muted" style="font-size:12.5px;line-height:1.8;margin-bottom:14px">先「跟读」把句子念顺，再「角色扮演」：对方说一句，你只说你自己那句，中文提示在、英文盖住。能撑住场面比说得完美重要。</div>'
      + '<div class="dlg-grid">' + cards + '</div>'
      + '<div class="divider"></div>'
      + '<div class="muted" style="font-size:12px">今天已完成 ' + done.length + ' 段，会记进打卡的「对话练习」。</div>'
      + '</div>';
    $$("[data-dlg]").forEach(function(el){
      el.onclick = function(){ startDialog(el.getAttribute("data-dlg")); };
    });
  }

  function renderDialogScene(){
    var d = dlgById(state.dialog.id);
    if(!d){ renderDialog(); return; }
    var st = state.dialog;
    var head = '<div class="flash-wrap">'
      + '<div style="display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap">'
      +   '<button class="btn sm" id="d-back">← 对话列表</button>'
      +   '<div class="modeseg" style="margin-left:auto">'
      +     '<button data-mode="read" class="' + (st.mode === "read" ? "on" : "") + '">跟读</button>'
      +     '<button data-mode="play" class="' + (st.mode === "play" ? "on" : "") + '">角色扮演</button>'
      +   '</div>'
      + '</div>'
      + '<div class="panel">'
      +   '<h2><span class="dot"></span>' + escapeHtml(d.title) + '</h2>'
      +   '<div class="muted" style="font-size:12.5px;line-height:1.7;margin-bottom:8px">' + escapeHtml(d.scene) + '</div>';
    var body = "";
    if(st.mode === "read"){
      body = d.lines.map(function(l){
        return '<div class="dline">'
          + '<div class="who">' + escapeHtml(d.roles[l.w] || l.w) + '</div>'
          + '<div class="dbody">'
          +   '<div class="den">' + escapeHtml(l.en) + '</div>'
          +   '<div class="dcn">' + escapeHtml(l.cn) + '</div>'
          +   '<div class="dbtns">'
          +     '<button class="btn sm" data-speak="' + escapeHtml(l.en) + '">朗读</button>'
          +     '<button class="btn sm" data-chunk="' + escapeHtml(l.en) + '">拆词</button>'
          +     '<button class="btn sm" data-rec="' + escapeHtml(l.en) + '">跟读</button>'
          +   '</div>'
          + '</div></div>';
      }).join("")
      + '<div class="divider"></div>'
      + '<div style="display:flex;gap:9px;flex-wrap:wrap">'
      +   '<button class="btn primary" id="d-play-mode">演一遍（角色扮演）</button>'
      +   '<button class="btn" id="d-finish">这一段练完了</button>'
      + '</div>';
    } else {
      var line = d.lines[st.idx];
      if(!line){
        body = '<div class="muted">这一段已经走完了</div>';
      } else {
        var mine = line.w === st.role;
        var roleHtml = '<div style="display:flex;gap:8px;align-items:center;margin:6px 0 12px;flex-wrap:wrap">'
          + '<span class="muted" style="font-size:12px">你演</span>'
          + '<button class="fchip' + (st.role === "A" ? " on" : "") + '" data-role="A">' + escapeHtml(d.roles.A) + '</button>'
          + '<button class="fchip' + (st.role === "B" ? " on" : "") + '" data-role="B">' + escapeHtml(d.roles.B) + '</button>'
          + '<span class="muted" style="font-size:11.5px">第 ' + (st.idx + 1) + ' / ' + d.lines.length + ' 句</span>'
          + '</div>';
        if(mine){
          body = roleHtml
            + '<div class="beatbox">'
            +   '<div class="muted" style="font-size:12px;margin-bottom:4px">该你说这句，先别看英文</div>'
            +   '<div style="font-size:15px;font-weight:600;margin-bottom:10px">' + escapeHtml(line.cn) + '</div>'
            +   (st.reveal
                  ? '<div style="font-size:17px;font-weight:600;color:var(--brand)">' + escapeHtml(line.en) + '</div>'
                    + '<div class="dbtns" style="justify-content:center;margin-top:12px">'
                    +   '<button class="btn sm" data-speak="' + escapeHtml(line.en) + '">朗读</button>'
                    +   '<button class="btn sm" data-chunk="' + escapeHtml(line.en) + '">拆词</button>'
                    +   '<button class="btn sm" data-rec="' + escapeHtml(line.en) + '">跟读</button>'
                    + '</div>'
                    + '<div style="margin-top:12px"><button class="btn primary" id="d-next">下一句</button></div>'
                  : '<button class="btn primary" id="d-reveal">说完了，看答案</button>'
                    + '<div style="margin-top:9px"><button class="btn sm" id="d-beat">不会说？跟读节拍带你一遍</button></div>')
            + '</div>';
        } else {
          body = roleHtml
            + '<div class="dline" style="border-bottom:0">'
            +   '<div class="who">对方</div>'
            +   '<div class="dbody">'
            +     '<div class="den">' + escapeHtml(line.en) + '</div>'
            +     '<div class="dcn">' + escapeHtml(line.cn) + '</div>'
            +     '<div class="dbtns">'
            +       '<button class="btn sm" data-speak="' + escapeHtml(line.en) + '">朗读</button>'
            +       '<button class="btn sm" data-chunk="' + escapeHtml(line.en) + '">拆词</button>'
            +     '</div>'
            +   '</div></div>'
            + '<div style="margin-top:12px"><button class="btn primary" id="d-next">轮到我说 →</button></div>';
        }
      }
    }
    $("#view").innerHTML = head + body + '</div></div>';
    $("#d-back").onclick = function(){ switchView("dialog"); };
    $$("[data-mode]").forEach(function(b){
      b.onclick = function(){
        st.mode = b.getAttribute("data-mode");
        st.idx = 0;
        st.reveal = false;
        renderDialogScene();
      };
    });
    $$("[data-speak]").forEach(function(b){
      b.onclick = function(){ speak(b.getAttribute("data-speak")); };
    });
    $$("[data-chunk]").forEach(function(b){
      b.onclick = function(){ speakChunk(b.getAttribute("data-chunk")); };
    });
    bindRecButtons();
    $$("[data-role]").forEach(function(b){
      b.onclick = function(){
        st.role = b.getAttribute("data-role");
        st.idx = 0;
        st.reveal = false;
        renderDialogScene();
      };
    });
    var pm = $("#d-play-mode");
    if(pm) pm.onclick = function(){ st.mode = "play"; st.idx = 0; st.reveal = false; renderDialogScene(); };
    var fin = $("#d-finish");
    if(fin) fin.onclick = finishDlg;
    var rv = $("#d-reveal");
    if(rv) rv.onclick = function(){ st.reveal = true; renderDialogScene(); };
    var bt = $("#d-beat");
    if(bt) bt.onclick = function(){ shadowRead(d.lines[st.idx].en, "先用节拍跟你念一遍"); };
    var nx = $("#d-next");
    if(nx) nx.onclick = function(){
      st.idx += 1;
      st.reveal = false;
      if(st.idx >= d.lines.length){ finishDlg(); return; }
      renderDialogScene();
    };
  }

  function finishDlg(){
    var d = dlgById(state.dialog.id);
    if(!d) return;
    var first = dlgDoneToday().indexOf(d.id) < 0;
    markDlgDone(d.id);
    $("#view").innerHTML = '<div class="flash-wrap"><div class="panel" style="text-align:center;padding:36px 22px">'
      + '<div style="font-size:32px;margin-bottom:8px">🎬</div>'
      + '<div style="font-size:16px;font-weight:650">「' + escapeHtml(d.title) + '」演完了</div>'
      + '<div class="muted" style="font-size:13px;margin:8px 0 18px;line-height:1.8">'
      +   (first ? "已经记进今天的「对话练习」。" : "今天这一段又练了一遍。")
      +   '明天换个角色再来一次，两种角色都演过才算真的会。</div>'
      + '<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">'
      +   '<button class="btn" id="d-again">换个角色再演</button>'
      +   '<button class="btn primary" id="d-to-today">回今日打卡</button>'
      + '</div></div></div>';
    $("#d-again").onclick = function(){
      state.dialog.role = state.dialog.role === "A" ? "B" : "A";
      state.dialog.mode = "play";
      state.dialog.idx = 0;
      state.dialog.reveal = false;
      renderDialogScene();
    };
    $("#d-to-today").onclick = function(){ switchView("today"); };
    paintOffline();
  }

  /* ---------------- router ---------------- */
  function switchView(v){
    state.view = v;
    var tabOf = (v === "quiz" || v === "leech") ? "review" : (v === "phonics" ? "guide" : v);
    $$(".tab").forEach(function(t){ t.classList.toggle("on", t.getAttribute("data-view") === tabOf); });
    if(TIMER.h && v !== "today"){ clearInterval(TIMER.h); TIMER.h = null; }
    renderView();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderView(){
    var v = state.view;
    if(v === "today") renderToday();
    else if(v === "review") renderReview();
    else if(v === "deck") renderDeck();
    else if(v === "progress") renderProgress();
    else if(v === "guide") renderGuide();
    else if(v === "phonics") renderPhonics();
    else if(v === "quiz") renderQuiz();
    else if(v === "leech") renderLeech();
    else if(v === "dialog") renderDialog();
  }

  $$(".tab").forEach(function(t){
    t.addEventListener("click", function(){ switchView(t.getAttribute("data-view")); });
  });

  function registerSW(){
    try{
      if("serviceWorker" in navigator && location.protocol === "https:"){
        navigator.serviceWorker.register("sw.js").catch(function(){});
      }
    }catch(e){}
  }

  async function boot(){
    bindAudioBar();
    registerSW();
    paintOffline();
    if(!wb() && !store(CACHE_KEYS.dash)){
      $("#banner").innerHTML = '<div class="banner">当前环境没有连接工作台能力，请在资料库中直接打开这个页面，数据才能正常读写。</div>';
    }
    var view = $("#view");
    view.innerHTML = '<div class="skel" style="height:140px;margin-bottom:16px"></div>'
      + '<div class="grid2"><div class="skel" style="height:280px"></div><div class="skel" style="height:280px"></div></div>';
    try{
      if(wb() && pendingList().length){ await flushPending(); }
      await loadDash();
      switchView("today");
    }catch(e){
      view.innerHTML = '<div class="empty"><div class="ic">⚠️</div>'
        + escapeHtml(e.message || "数据加载失败")
        + '<div style="margin-top:14px"><button class="btn" id="retry">重新加载</button></div></div>';
      var r = $("#retry");
      if(r) r.onclick = boot;
    }
    if("speechSynthesis" in window){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function(){};
    }
  }

  boot();
})();
</script>
</body>
</html>
